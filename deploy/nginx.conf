# /etc/nginx/sites-available/ngtraders  (then symlink into sites-enabled)
# Get the HTTPS certificate with:  sudo certbot --nginx -d yourdomain.com -d www.yourdomain.com
# Certbot adds the 443 server block and the HTTP->HTTPS redirect for you.

server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com;

    client_max_body_size 6M;   # product import file limit is 5 MB

    location /static/ { alias /srv/ngtraders/app/staticfiles/; expires 7d; }
    location /media/  { alias /srv/ngtraders/app/media/; expires 7d; }

    location / {
        proxy_pass http://unix:/run/ngtraders.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # overwrite (not append) so visitors cannot fake their IP for rate limiting
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
